<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar canje')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1>Registrar canje</h1>
    <form th:action="@{/redemptions}" th:object="${redemptionForm}" method="post" class="form">
        <div class="field">
            <label for="customerId">Cliente</label>
            <select id="customerId" th:field="*{customerId}">
                <option value="">Seleccione un cliente</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="|${customer.name} · ${customer.points} puntos|">Ana Torres · 0 puntos</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}">Seleccione un cliente.</p>
        </div>
        <div class="field">
            <label for="rewardId">Recompensa</label>
            <select id="rewardId" th:field="*{rewardId}">
                <option value="">Seleccione una recompensa</option>
                <option th:each="reward : ${rewards}"
                        th:value="${reward.id}"
                        th:text="|${reward.name} · ${reward.requiredPoints} puntos|">Postre del día · 30 puntos</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('rewardId')}" th:errors="*{rewardId}">Seleccione una recompensa.</p>
        </div>
        <div class="error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">La recompensa no está disponible.</p>
        </div>
        <div class="actions">
            <button type="submit" class="button">Canjear</button>
            <a th:href="@{/redemptions}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
