<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recompensas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('rewards')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1>Recompensas</h1>
    <p class="empty" th:if="${#lists.isEmpty(rewards)}">No hay recompensas disponibles.</p>
    <div class="table-wrapper" th:unless="${#lists.isEmpty(rewards)}">
        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th class="numeric">Costo</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reward : ${rewards}">
                <td th:text="${reward.name}">Café americano</td>
                <td th:text="${reward.description}">Un café americano de la casa.</td>
                <td class="numeric" th:text="|${reward.requiredPoints} puntos|">10 puntos</td>
                <td>
                    <div class="actions">
                        <a class="button secondary" th:href="@{/redemptions/new(rewardId=${reward.id})}">Canjear</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
