<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Tienda de Café'">Tienda de Café</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav(active)" class="nav">
    <a th:href="@{/}" th:class="${active == 'home'} ? 'active' : null"
       th:attr="aria-current=${active == 'home'} ? 'page' : null">Tienda de Café</a>
    <a th:href="@{/customers}" th:class="${active == 'customers'} ? 'active' : null"
       th:attr="aria-current=${active == 'customers'} ? 'page' : null">Clientes</a>
    <a th:href="@{/purchases}" th:class="${active == 'purchases'} ? 'active' : null"
       th:attr="aria-current=${active == 'purchases'} ? 'page' : null">Compras</a>
    <a th:href="@{/points}" th:class="${active == 'points'} ? 'active' : null"
       th:attr="aria-current=${active == 'points'} ? 'page' : null">Puntos</a>
    <a th:href="@{/rewards}" th:class="${active == 'rewards'} ? 'active' : null"
       th:attr="aria-current=${active == 'rewards'} ? 'page' : null">Recompensas</a>
    <a th:href="@{/redemptions}" th:class="${active == 'redemptions'} ? 'active' : null"
       th:attr="aria-current=${active == 'redemptions'} ? 'page' : null">Canjes</a>
</nav>
<div th:fragment="flash" th:if="${message}" class="flash flash-success" role="status" th:text="${message}"></div>
</body>
</html>
