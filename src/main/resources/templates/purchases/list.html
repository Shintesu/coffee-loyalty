<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Compras')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('purchases')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="page-header">
        <h1>Compras</h1>
        <a class="button primary" th:href="@{/purchases/new}">Registrar compra</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(purchases)}">No hay compras registradas.</p>
    <div class="table-wrapper" th:unless="${#lists.isEmpty(purchases)}">
        <table>
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Cliente</th>
                <th class="numeric">Monto</th>
                <th class="numeric">Puntos obtenidos</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="purchase : ${purchases}">
                <td th:text="${#temporals.format(purchase.createdAt, 'dd/MM/yyyy HH:mm')}">26/10/2026 15:30</td>
                <td th:text="${purchase.customer.name}">Ana Torres</td>
                <td class="numeric" th:text="${'$' + #numbers.formatDecimal(purchase.amount, 1, 'COMMA', 2, 'POINT')}">$9.99</td>
                <td class="numeric" th:text="${purchase.pointsEarned}">10</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
