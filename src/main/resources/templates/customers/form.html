<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${customerId != null ? 'Editar cliente' : 'Nuevo cliente'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('customers')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <h1 th:text="${customerId != null ? 'Editar cliente' : 'Nuevo cliente'}">Nuevo cliente</h1>
    <form th:action="${customerId != null} ? @{/customers/{id}(id=${customerId})} : @{/customers}"
          th:object="${customerForm}" method="post" class="form">
        <div class="field">
            <label for="name">Nombre</label>
            <input type="text" id="name" th:field="*{name}">
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">El nombre es obligatorio.</p>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">El email no es válido.</p>
        </div>
        <div class="actions">
            <button type="submit" class="button primary">Guardar</button>
            <a class="button secondary" th:href="@{/customers}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
