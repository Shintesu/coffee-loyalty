<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${customer.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="container">
    <div class="page-header">
        <h1 th:text="${customer.name}">Ana Torres</h1>
        <a class="button" th:href="@{/purchases/new(customerId=${customer.id})}">Registrar compra</a>
    </div>
    <p>Email: <span th:text="${customer.email}">ana@example.com</span></p>
    <p>Saldo actual: <strong th:text="|${customer.points} puntos|">0 puntos</strong></p>
    <h2>Compras</h2>
    <p th:if="${#lists.isEmpty(purchases)}">Este cliente no tiene compras registradas.</p>
    <table th:unless="${#lists.isEmpty(purchases)}">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Monto</th>
            <th>Puntos obtenidos</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="purchase : ${purchases}">
            <td th:text="${#temporals.format(purchase.createdAt, 'dd/MM/yyyy HH:mm')}">26/10/2026 15:30</td>
            <td th:text="${'$' + #numbers.formatDecimal(purchase.amount, 1, 'COMMA', 2, 'POINT')}">$9.99</td>
            <td th:text="${purchase.pointsEarned}">10</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
